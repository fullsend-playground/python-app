agent: agents/explore.md
role: triage
image: ghcr.io/fullsend-ai/fullsend-sandbox:latest

host_files:
  - src: /tmp/workspace/explore-prefetch.json
    dest: /sandbox/workspace/explore-prefetch.json
    optional: true

pre_script: scripts/pre-explore.sh
timeout_minutes: 5

trigger: >
  event.transition.kind == "label_changed"
    && event.transition.label.name == "fullsend-pre-script-demo"
    && event.transition.label.action == "added"
