    - https://raw.githubusercontent.com/fullsend-ai/agents/
agents:
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/ffbec3c272db1c32bb5b39286b1bf06bf2e1ccb0/harness/triage.yaml#sha256=fc5a7497cf846f8a7eff7b1435b830b6f548cc12818adb8326b73c6d91e1224e
create_issues:
    allow_targets:
        repos:
            - fullsend-playground/python-app
