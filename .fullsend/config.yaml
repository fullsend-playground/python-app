# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
runtime: claude
roles:
    - triage
    - coder
    - review
    - fix
    - retro
agents:
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/56b9aa3a2a5b02d0000d1bd3f8df2fd65560a294/harness/triage.yaml#sha256=5ada8f85cee204e2fcb8ba6935b301345b3dc56ee3f306d6eafd35f7bc4312a7
    - name: explore-pre-script-fetch-proof
      source: harness/explore.yaml
      runtime: pi
      model: opus
    - name: pi-script-loop
      source: harness/pi-script-loop.yaml
      runtime: pi
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - fullsend-playground/python-app
