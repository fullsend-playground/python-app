# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
runtime: claude
roles:
    - triage
    - coder
    - review
    - fix
    - retro
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
agents:
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/e7ba3d123639b01d9005996e8ab2bc96c9ba03a2/harness/triage.yaml#sha256=fc5a7497cf846f8a7eff7b1435b830b6f548cc12818adb8326b73c6d91e1224e
create_issues:
    allow_targets:
        repos:
            - fullsend-playground/python-app
