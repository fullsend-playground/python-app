[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

[project]
name = "python-app"
version = "0.1.0"
description = "Simple Flask API for demonstrating fullsend agent capabilities"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "jsonschema>=4.23",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
